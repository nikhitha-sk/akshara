[project]
name = "akshara"
version = "0.1.0"
description = "AI language toolkit for Kannada and Tulu: transliteration, spell-check, OCR, speech-to-text"
authors = [{ name = "Nikhitha S Kotian" }]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
